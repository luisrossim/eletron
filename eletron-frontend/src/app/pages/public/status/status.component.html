<app-header></app-header>

<div class="container mx-auto mt-4 mb-8 px-3 md:px-6">
    <p-breadcrumb class="max-w-full" [model]="items" [home]="home" />

    <div class="flex flex-col h-56 items-center mt-16 mb-20 justify-center text-zinc-700 text-center gap-2">
        <p class="text-lg md:text-2xl font-semibold">Digite o código do serviço:</p>
        <div class="flex flex-wrap justify-center gap-4">
            <p-iconField iconPosition="left">
                <p-inputIcon styleClass="pi pi-search" />
                <input type="text" pInputText placeholder="Ex: 2024ZMLY" />
            </p-iconField>
            <p-button label="Consultar" size="small" icon="pi pi-search" [rounded]="true" />
        </div>
    </div>
</div>

<app-footer></app-footer>
